<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNAS Yeovilton Summer Ball 2026 • Country Themed Party</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .heading-font { font-family: 'Playfair Display', sans-serif; }
        .navy-gradient { background: linear-gradient(135deg, #001f3f 0%, #003366 100%); }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="navy-gradient text-white py-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-plane fa-2xl"></i>
                <div>
                    <h1 class="heading-font text-2xl tracking-tight">RNAS YEOVILTON</h1>
                    <p class="text-xs tracking-[2px] -mt-1 opacity-90">SUMMER BALL 2026 • COUNTRY THEMED</p>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero-bg text-white py-24 md:py-32" style="background-image: linear-gradient(rgba(0,31,63,0.75), rgba(0,31,63,0.85)), url('https://news.cision.com/defence-infrastructure-organisation/r/dio-delivers-somerset-military-accommodation-ahead-of-time,c9511918/@@images/hero.jpg'); background-size: cover;">
        <div class="max-w-6xl mx-auto px-6 text-center">
            <h2 class="heading-font text-5xl md:text-6xl leading-none tracking-tighter mb-4">RNAS Yeovilton<br>Summer Ball 2026</h2>
            <p class="text-3xl text-amber-400 font-medium">Country Themed Party</p>
            <p class="mt-4 text-xl">The Wardroom • Saturday 11 July 2026</p>
        </div>
    </header>

    <section id="tickets" class="max-w-6xl mx-auto px-6 py-16">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-semibold mb-3">Reserve Your Tickets</h2>
            <p class="text-slate-600">£50 per person • Country Themed Party at The Wardroom</p>
        </div>

        <div class="grid md:grid-cols-5 gap-12">
            <div class="md:col-span-3 bg-white rounded-3xl shadow-xl p-10">
                <form id="ticketForm" action="https://formsubmit.co/graniteheed@gmail.com" method="POST" class="space-y-8">
                    <input type="hidden" name="_subject" value="Summer Ball Ticket - New Booking">
                    <input type="hidden" name="_next" value="https://graniteheed-gif.github.io/RNAS-Yeovilton-Summer-Ball-2026/?success=true">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_template" value="table">

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Full Name <span class="text-red-500">*</span></label>
                            <input type="text" name="full_name" required class="w-full px-4 py-4 border border-slate-200 rounded-2xl">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Service Number <span class="text-slate-400">(8 digits if applicable)</span></label>
                            <input type="text" name="service_number" maxlength="8" class="w-full px-4 py-4 border border-slate-200 rounded-2xl">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Email Address <span class="text-red-500">*</span></label>
                        <input type="email" name="email" required class="w-full px-4 py-4 border border-slate-200 rounded-2xl">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Number of Tickets <span class="text-red-500">*</span></label>
                        <select name="num_tickets" id="num_tickets" required onchange="updateTotal()" class="w-full px-4 py-4 border border-slate-200 rounded-2xl">
                            <option value="1">1 (£50)</option>
                            <option value="2" selected>2 (£100)</option>
                            <option value="3">3 (£150)</option>
                            <option value="4">4 (£200)</option>
                            <option value="5">5 (£250)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Dietary Requirements</label>
                        <textarea name="dietary_requirements" rows="3" class="w-full px-4 py-4 border border-slate-200 rounded-2xl" placeholder="Vegetarian, Vegan, Gluten Free, None..."></textarea>
                    </div>

                    <button type="submit" class="w-full bg-amber-400 hover:bg-amber-300 text-navy-900 font-semibold py-5 rounded-2xl text-xl">
                        CONTINUE TO PAYMENT (£<span id="totalPrice">100</span>)
                    </button>
                </form>
            </div>

            <!-- SUCCESS SCREEN -->
            <div class="md:col-span-2">
                <div id="successScreen" class="hidden bg-emerald-50 border border-emerald-300 rounded-3xl p-10 text-center">
                    <i class="fa-solid fa-circle-check text-6xl text-emerald-600 mb-6"></i>
                    <h2 class="text-3xl font-semibold text-emerald-800">Booking Received!</h2>
                    <p class="mt-4 text-lg">Confirmation email has been sent.</p>
                    
                    <div class="mt-8 p-6 bg-white rounded-2xl text-left">
