<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNAS Yeovilton Summer Ball 2026 • Country Themed Party</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .heading-font { font-family: 'Playfair Display', sans-serif; }
        .navy-gradient { background: linear-gradient(135deg, #001f3f 0%, #003366 100%); }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="navy-gradient text-white py-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-plane fa-2xl"></i>
                <div>
                    <h1 class="heading-font text-2xl">RNAS YEOVILTON</h1>
                    <p class="text-xs -mt-1">SUMMER BALL 2026 • COUNTRY THEMED</p>
                </div>
            </div>
        </div>
    </nav>

    <section id="tickets" class="max-w-6xl mx-auto px-6 py-16">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-semibold">Reserve Your Tickets</h2>
            <p class="text-slate-600">£50 per person • The Wardroom • Country Themed Party</p>
        </div>

        <div class="grid md:grid-cols-5 gap-12">
            <div class="md:col-span-3 bg-white rounded-3xl shadow-xl p-10">
                <form id="ticketForm" action="https://formsubmit.co/YOUR_EMAIL_HERE" method="POST" class="space-y-8">
                    
                    <input type="hidden" name="_subject" value="Summer Ball Ticket - New Booking">
                    <input type="hidden" name="_next" value="https://YOUR-USERNAME.github.io/RNAS-Yeovilton-Summer-Ball-2026/#success">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_template" value="table">

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label>Full Name <span class="text-red-500">*</span></label>
                            <input type="text" name="full_name" required class="w-full px-4 py-4 border rounded-2xl">
                        </div>
                        <div>
                            <label>Service Number (if applicable)</label>
                            <input type="text" name="service_number" class="w-full px-4 py-4 border rounded-2xl">
                        </div>
                    </div>

                    <div>
                        <label>Email Address <span class="text-red-500">*</span></label>
                        <input type="email" name="email" required class="w-full px-4 py-4 border rounded-2xl">
                    </div>

                    <div>
                        <label>Number of Tickets <span class="text-red-500">*</span></label>
                        <select name="num_tickets" id="num_tickets" required onchange="updateTotal()" class="w-full px-4 py-4 border rounded-2xl">
                            <option value="1">1 (£50)</option>
                            <option value="2" selected>2 (£100)</option>
                            <option value="3">3 (£150)</option>
                            <option value="4">4 (£200)</option>
                            <option value="5">5 (£250)</option>
                        </select>
                    </div>

                    <div>
                        <label>Dietary Requirements</label>
                        <textarea name="dietary_requirements" rows="3" class="w-full px-4 py-4 border rounded-2xl" placeholder="Vegetarian, Vegan, Gluten Free, None, etc."></textarea>
                    </div>

                    <button onclick="handleSubmit(event)" type="button" 
                            class="w-full bg-amber-400 hover:bg-amber-300 py-5 rounded-2xl text-xl font-semibold">
                        CONTINUE TO PAYMENT (£<span id="totalPrice">100</span>)
                    </button>
                </form>
            </div>

            <div class="md:col-span-2">
                <div id="paymentBox" class="hidden bg-emerald-50 p-8 rounded-3xl"></div>
            </div>
        </div>
    </section>

    <script>
        const PRICE = 50;
        function updateTotal() {
            const n = parseInt(document.getElementById('num_tickets').value) || 1;
            document.getElementById('totalPrice').textContent = n * PRICE;
        }

        function handleSubmit(e) {
            e.preventDefault();
            const form = document.getElementById('ticketForm');
            const ref = "YB-" + Date.now().toString(36).toUpperCase().slice(-6);
            
            const refField = document.createElement("input");
            refField.type = "hidden";
            refField.name = "booking_reference";
            refField.value = ref;
            form.appendChild(refField);

            document.getElementById('paymentBox').classList.remove('hidden');
            document.getElementById('paymentBox').innerHTML = `
                <p class="font-medium">Booking Reference: <strong>${ref}</strong></p>
                <p class="text-sm mt-4">Please pay £<span id="payAmount"></span> by bank transfer using this reference.</p>
            `;
            document.getElementById('payAmount').textContent = (parseInt(document.getElementById('num_tickets').value) * PRICE);

            setTimeout(() => form.submit(), 700);
        }

        window.onload = updateTotal;
    </script>
</body>
</html>
